<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">OpenSSH Manager</title>
  <desc id="desc">An original vector interpretation of OpenSSH's sunglasses-wearing pufferfish, with a secure briefcase and a Windows-inspired blue palette.</desc>
  <defs>
    <linearGradient id="body" x1="68" y1="36" x2="200" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#50C8FF"/>
      <stop offset=".48" stop-color="#00A4EF"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="case" x1="40" y1="162" x2="117" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#075799"/>
      <stop offset="1" stop-color="#003A70"/>
    </linearGradient>
    <linearGradient id="lens" x1="107" y1="86" x2="180" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#174C75"/>
      <stop offset="1" stop-color="#072843"/>
    </linearGradient>
  </defs>
  <!-- Tail and puffer silhouette; no embedded raster or external assets. -->
  <path d="M49 103 19 88Q7 119 20 150L49 135Z" fill="#0078D4" stroke="#064A7D" stroke-width="4" stroke-linejoin="round"/>
  <path d="m52 82-9-22 25 6-2-27 22 17 8-32 18 25 18-34 11 31 25-25-1 31 30-15-10 31 29-3-17 24 25 8-22 17 24 17-29 8 13 26-29-4 1 29-25-16-10 29-18-25-23 22-3-32-29 10 10-28-28-4 21-21-25-15 28-13Z"
        fill="url(#body)" stroke="#064A7D" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="132" cy="113" rx="68" ry="65" fill="url(#body)"/>
  <!-- The two lenses and short bridge keep the OpenSSH agent silhouette legible. -->
  <path d="M91 87Q115 77 139 85L142 93 153 89Q176 73 207 81L212 94 205 112Q181 124 160 112L153 101 141 103Q133 122 111 119L99 113Z"
        fill="url(#lens)" stroke="#05263E" stroke-width="5" stroke-linejoin="round"/>
  <path d="m64 78 34 15M112 87l-10 21M177 83l-13 25" fill="none" stroke="#A4E4FF" stroke-width="5" stroke-linecap="round"/>
  <path d="m208 121 26 12-23 9" fill="#008EE3" stroke="#064A7D" stroke-width="4" stroke-linejoin="round"/>
  <path d="m209 133 22 1" fill="none" stroke="#064A7D" stroke-width="3" stroke-linecap="round"/>
  <!-- White collar and navy tie reference the OpenSSH secret-agent mascot. -->
  <path d="M58 123Q109 153 182 160L172 179Q99 166 56 136Z" fill="#F3FAFF" stroke="#064A7D" stroke-width="4" stroke-linejoin="round"/>
  <path d="m140 159 16 3-5 16-16-5Z" fill="#053D6A"/>
  <path d="m136 175 14 3 10 44-18 15-15-22Z" fill="#075799" stroke="#053D6A" stroke-width="4" stroke-linejoin="round"/>
  <!-- A small protected case replaces tiny lettering at application-icon sizes. -->
  <path d="M63 177v-12q0-13 13-13h7q13 0 13 13v12" fill="none" stroke="#053D6A" stroke-width="8" stroke-linecap="round"/>
  <rect x="38" y="172" width="80" height="66" rx="12" fill="url(#case)" stroke="#053D6A" stroke-width="4"/>
  <path d="M40 190q38 14 76 0" fill="none" stroke="#62CFFF" stroke-width="3"/>
  <path d="m77 193 15 6v10q0 13-15 20-15-7-15-20v-10Z" fill="#E6F7FF"/>
  <circle cx="77" cy="207" r="4" fill="#0078D4"/>
  <path d="M77 209v8" stroke="#0078D4" stroke-width="4" stroke-linecap="round"/>
</svg>
